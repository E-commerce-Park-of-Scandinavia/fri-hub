name: Keep Supabase awake

# Supabase pauses a free project after 7 days without database activity, which
# takes the hub offline until someone restores it by hand. This makes a tiny
# query three times a week so the project never goes idle that long.
#
# It doubles as a monitor: if the database is unreachable, this job goes red and
# GitHub emails the repository owner.

on:
  schedule:
    # 06:00 UTC on Monday, Wednesday and Friday — never more than a 3-day gap.
    - cron: "0 6 * * 1,3,5"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing repository secrets SUPABASE_URL and/or SUPABASE_ANON_KEY."
            exit 1
          fi

          # Row Level Security means this returns an empty list to an anonymous
          # caller — which is fine. What matters is that it reaches the database.
          status=$(curl -sS -m 30 -o /tmp/body -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/programs?select=id&limit=1") || {
              echo "::error::Could not reach ${SUPABASE_URL} at all. The project may be paused or deleted."
              exit 1
            }

          echo "HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${status}. Response:"
            cat /tmp/body
            exit 1
          fi

          echo "Database reachable — project stays awake."
